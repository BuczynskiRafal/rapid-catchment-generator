name: Feature Request
description: Suggest an improvement or new capability for Rapid Catchment Generator
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What hydrological modeling workflow or task would this feature improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like the feature to work in the GUI, CLI, or Python API.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any relevant SWMM sections, literature references, or examples.
    validations:
      required: false
